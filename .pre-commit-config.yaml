repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: block-root-sprawl
        name: Block root-level file sprawl
        entry: python scripts/dev/block_root_sprawl.py
        language: system
        pass_filenames: false
        always_run: true
